# .github/workflows/monitor.yml
#
# Runs every 5 minutes — checks app health.
# Sends alert via Telegram and email (Resend) on failure.
#
# Required secrets:
#   TELEGRAM_BOT_TOKEN  — from @BotFather
#   TELEGRAM_CHAT_ID    — your personal chat ID (get from @userinfobot)
#   RESEND_API_KEY      — same key used by send-invite edge function
#   ALERT_EMAIL         — destination email for failure alerts

name: Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check app (staging)
        id: check-prod
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://staging.mis-kitchen-prod.pages.dev/this-does-not-exist-404)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "App status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
        continue-on-error: true

      - name: Check manifest.json
        id: check-manifest
        run: |
          curl -sf --max-time 10 https://staging.mis-kitchen-prod.pages.dev/this-does-not-exist-404/manifest.json > /dev/null
          echo "Manifest: OK"
        continue-on-error: true

      - name: Check service worker
        id: check-sw
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://staging.mis-kitchen-prod.pages.dev/this-does-not-exist-404/sw.js)
          [ "$STATUS" = "200" ] || exit 1
          echo "SW: OK"
        continue-on-error: true

      - name: Alert via Telegram
        if: |
          steps.check-prod.outcome == 'failure' ||
          steps.check-manifest.outcome == 'failure' ||
          steps.check-sw.outcome == 'failure'
        run: |
          TEXT="🚨 *Mis Kitchen Staging — Health Check Failed*%0A%0A• App: ${{ steps.check-prod.outcome }}%0A• manifest.json: ${{ steps.check-manifest.outcome }}%0A• sw.js: ${{ steps.check-sw.outcome }}%0A%0A[View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
        continue-on-error: true

      - name: Alert via Email (Resend)
        if: |
          steps.check-prod.outcome == 'failure' ||
          steps.check-manifest.outcome == 'failure' ||
          steps.check-sw.outcome == 'failure'
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "monitor@mis.kitchen",
              "to": "${{ secrets.ALERT_EMAIL }}",
              "subject": "🚨 Mis Kitchen Staging — Health Check Failed",
              "html": "<p><b>Health check failed</b></p><ul><li>App: ${{ steps.check-prod.outcome }}</li><li>manifest.json: ${{ steps.check-manifest.outcome }}</li><li>sw.js: ${{ steps.check-sw.outcome }}</li></ul><p><a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View logs</a></p>"
            }'
        continue-on-error: true
