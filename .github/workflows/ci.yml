name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Push to staging/main: full pipeline ───────────────────────
  deploy:
    name: Deploy
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  e2e:
    name: E2E Sanity
    if: github.event_name == 'push'
    needs: deploy
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  e2e-invite:
    name: E2E Invite & Onboarding
    if: github.event_name == 'push'
    needs: e2e
    uses: ./.github/workflows/e2e-invite.yml
    secrets: inherit

  # ── Pull requests: lint + build + preview ─────────────────────
  check-pr:
    name: Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "lts/*"
      PNPM_VERSION: "9"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v5
        with: { version: "9" }
      - uses: actions/setup-node@v6.4.0
        with: { node-version: "lts/*", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          VITE_SUPABASE_URL:      ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV:           preview
          VITE_VAPID_PUBLIC_KEY:  ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN:        ${{ secrets.VITE_SENTRY_DSN }}
      - name: Deploy preview
        id: cf-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=mis-kitchen-prod --branch=pr-${{ github.event.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Deploy\n\n| | |\n|---|---|\n| **URL** | ${{ steps.cf-deploy.outputs.deployment-url }} |\n| **Branch** | \`${{ github.head_ref }}\` |\n| **Commit** | \`${{ github.sha }}\` |\n\n_Preview uses staging Supabase project_`
            })
