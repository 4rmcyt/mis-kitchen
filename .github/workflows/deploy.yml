name: Deploy

on:
  workflow_call:
  workflow_dispatch:

env:
  NODE_VERSION: "lts/*"
  PNPM_VERSION: "11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── 1. Lint + type check ──────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v5
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  # ── 2. Build ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check

    strategy:
      matrix:
        environment: ${{ github.ref == 'refs/heads/main' && fromJson('["prod"]') || fromJson('["staging"]') }}

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v5
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL:      ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV:           ${{ matrix.environment }}
          VITE_VAPID_PUBLIC_KEY:  ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN:        ${{ secrets.VITE_SENTRY_DSN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.environment }}
          path: dist/
          retention-days: 1

  # ── 3. DB Migrations ─────────────────────────────────────────
  migrate:
    name: DB Migration
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with: { version: 2.101.0 }

      - name: Run migrations (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STG }}
          supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD_STG }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run migrations (prod)
        if: github.ref == 'refs/heads/main'
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ── 4. Edge Functions ─────────────────────────────────────────
  deploy-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with: { version: 2.101.0 }

      - name: Deploy functions (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STG }}
          supabase functions deploy send-report
          supabase functions deploy send-invite
          supabase functions deploy send-push
          supabase functions deploy push-sync
          supabase functions deploy push-webhook --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy functions (prod)
        if: github.ref == 'refs/heads/main'
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          supabase functions deploy send-report
          supabase functions deploy send-invite
          supabase functions deploy send-push
          supabase functions deploy push-sync
          supabase functions deploy push-webhook --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ── 5. Frontend → Cloudflare Pages ───────────────────────────
  deploy-frontend:
    name: Frontend → Cloudflare
    runs-on: ubuntu-latest
    needs: [build, deploy-functions]

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v5
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build (staging)
        if: github.ref == 'refs/heads/staging'
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist-staging
          path: dist/

      - name: Download build (prod)
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist-prod
          path: dist/

      - name: Deploy to Cloudflare Pages (staging)
        if: github.ref == 'refs/heads/staging'
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=mis-kitchen-prod --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (prod)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=mis-kitchen-prod --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 6. Smoke test (prod only) ─────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for propagation
        run: sleep 15

      - name: Check app is reachable
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.APP_URL }})
          if [ "$STATUS" != "200" ]; then echo "App returned $STATUS"; exit 1; fi
          echo "App is up"

      - name: Check PWA manifest
        run: |
          curl -sf https://${{ vars.APP_URL }}/manifest.json | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert d['name']; print('manifest.json OK')"

      - name: Check service worker
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.APP_URL }}/sw.js)
          if [ "$STATUS" != "200" ]; then echo "sw.js returned $STATUS"; exit 1; fi
          echo "sw.js OK"
