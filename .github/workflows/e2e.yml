name: E2E Sanity

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      url:
        description: Target URL (defaults to staging)
        required: false

env:
  NODE_VERSION: "lts/*"
  PNPM_VERSION: "9"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: Cucumber E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: staging

      - uses: pnpm/action-setup@v5
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Write .env.test
        env:
          TEST_URL: ${{ inputs.url || vars.STAGING_URL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_COOK_EMAIL: ${{ secrets.TEST_COOK_EMAIL }}
          TEST_COOK_PASSWORD: ${{ secrets.TEST_COOK_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          printf 'TEST_URL=%s\nTEST_ADMIN_EMAIL=%s\nTEST_ADMIN_PASSWORD=%s\nTEST_COOK_EMAIL=%s\nTEST_COOK_PASSWORD=%s\nSUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$TEST_URL" "$TEST_ADMIN_EMAIL" "$TEST_ADMIN_PASSWORD" "$TEST_COOK_EMAIL" "$TEST_COOK_PASSWORD" "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" > .env.test

      - name: Run E2E tests
        run: pnpm test:e2e --format progress

      - name: Run mobile layout tests
        run: pnpm test:mobile --format progress

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-report-${{ github.run_number }}
          path: e2e/reports/
          retention-days: 14
