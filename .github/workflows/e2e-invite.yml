name: E2E Invite & Onboarding

on:
  workflow_call:
  workflow_dispatch:

env:
  NODE_VERSION: "lts/*"
  PNPM_VERSION: "11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
  PNPM_CONFIG_APPROVED_BUILDS: "esbuild,sharp,workerd,tsx"

jobs:
  e2e-invite:
    name: Invite & Onboarding Flow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: staging

      - uses: pnpm/action-setup@v5
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Write .env.test
        env:
          TEST_URL: ${{ vars.STAGING_URL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_COOK_EMAIL: ${{ secrets.TEST_COOK_EMAIL }}
          TEST_COOK_PASSWORD: ${{ secrets.TEST_COOK_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
          MAILTRAP_INBOX_ID: ${{ secrets.MAILTRAP_INBOX_ID }}
        run: |
          printf 'TEST_URL=%s\nTEST_ADMIN_EMAIL=%s\nTEST_ADMIN_PASSWORD=%s\nTEST_COOK_EMAIL=%s\nTEST_COOK_PASSWORD=%s\nSUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nMAILTRAP_API_TOKEN=%s\nMAILTRAP_INBOX_ID=%s\n' \
            "$TEST_URL" "$TEST_ADMIN_EMAIL" "$TEST_ADMIN_PASSWORD" "$TEST_COOK_EMAIL" "$TEST_COOK_PASSWORD" "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" "$MAILTRAP_API_TOKEN" "$MAILTRAP_INBOX_ID" > .env.test

      - name: Run invite & onboarding E2E
        run: pnpm test:invite --format progress

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: invite-e2e-report-${{ github.run_number }}
          path: e2e/reports/invite-report.html
          retention-days: 14
