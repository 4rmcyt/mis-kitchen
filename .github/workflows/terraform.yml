# .github/workflows/terraform.yml
#
# Runs when files in terraform/ change
# Plan on PR, Apply on merge to main/staging
#
# Required GitHub Secrets:
#   TF_VAR_cloudflare_api_token
#   TF_VAR_supabase_access_token
#   TF_VAR_cloudflare_account_id
#   TF_VAR_cloudflare_zone_id
#   TF_VAR_supabase_org_id
#   TF_VAR_supabase_db_password_prod
#   TF_VAR_supabase_db_password_stg
#   R2_ACCESS_KEY_ID       (for Terraform state backend in Cloudflare R2)
#   R2_SECRET_ACCESS_KEY
#   R2_ENDPOINT            (https://<account_id>.r2.cloudflarestorage.com)

name: Terraform

on:
  push:
    branches: [main, staging]
    paths: ["terraform/**"]
  pull_request:
    branches: [main, staging]
    paths: ["terraform/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TF_VAR_cloudflare_api_token:  ${{ secrets.TF_VAR_cloudflare_api_token }}
      TF_VAR_cloudflare_account_id: ${{ secrets.TF_VAR_cloudflare_account_id }}
      TF_VAR_cloudflare_zone_id:    ${{ secrets.TF_VAR_cloudflare_zone_id }}
      TF_VAR_domain:                ${{ vars.DOMAIN }}
      AWS_ACCESS_KEY_ID:            ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:        ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "workspace=prod" >> "$GITHUB_OUTPUT"
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "workspace=staging" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate tfvars
        run: |
          cat > ci.tfvars <<EOF
          environment           = "${{ steps.env.outputs.environment }}"
          domain                = "${{ vars.DOMAIN }}"
          cloudflare_api_token  = "${{ secrets.TF_VAR_cloudflare_api_token }}"
          cloudflare_account_id = "${{ secrets.TF_VAR_cloudflare_account_id }}"
          cloudflare_zone_id    = "${{ secrets.TF_VAR_cloudflare_zone_id }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ steps.env.outputs.workspace }} || \
          terraform workspace new    ${{ steps.env.outputs.workspace }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=ci.tfvars \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## 🏗 Terraform Plan — `${{ steps.env.outputs.workspace }}`',
                '',
                '<details><summary>Show Plan</summary>',
                '',
                '```hcl',
                truncated,
                '```',
                '</details>',
                '',
                `Plan status: ${{ steps.plan.outcome }}`,
              ].join('\n')
            })

      - name: Terraform Apply
        if: github.event_name == 'push' && steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan

      - name: Output results
        if: github.event_name == 'push'
        run: terraform output
