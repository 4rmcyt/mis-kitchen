<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0C0C0C" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mis" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Splash screen color on iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- SEO / share -->
  <title>Mis — Line Cook</title>
  <meta name="description" content="Prep checklists, recipes and shift tools for line cooks" />

  <!-- Prevent zoom on input focus (kitchen use) -->
  <style>
    input, select, textarea { font-size: 16px !important; }
    * { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior-y: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('[Mis] SW registered:', reg.scope);

            // Check for updates every 60s while app is open
            setInterval(() => reg.update(), 60000);
          })
          .catch(err => console.error('[Mis] SW error:', err));
      });
    }

    // iOS "Add to Home Screen" hint
    // Show once per session if not already installed
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone;
    if (isIOS && !isStandalone && !sessionStorage.getItem('mis_ios_hint')) {
      sessionStorage.setItem('mis_ios_hint', '1');
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const banner = document.createElement('div');
          banner.style.cssText = `
            position: fixed; bottom: 80px; left: 16px; right: 16px;
            background: #1C1C1C; border: 1px solid #F97316;
            border-radius: 12px; padding: 12px 16px;
            font-family: monospace; font-size: 13px; color: #E8E8E0;
            z-index: 9999; display: flex; align-items: center; gap: 10px;
          `;
          banner.innerHTML = `
            <span style="font-size:20px">📲</span>
            <span>Tap <strong style="color:#F97316">Share → Add to Home Screen</strong> to install Mis</span>
            <button onclick="this.parentElement.remove()" style="background:none;border:none;color:#555;font-size:18px;cursor:pointer;margin-left:auto">×</button>
          `;
          document.body.appendChild(banner);
          setTimeout(() => banner.remove(), 8000);
        }, 2000);
      });
    }
  </script>
</body>
</html>
